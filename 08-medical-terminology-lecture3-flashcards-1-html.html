function build(){const q=$('search').value.trim().toLowerCase(),tag=$('category').value,mode=$('mode').value;const current=filtered[index];filtered=order.filter(i=>{const c=cards[i];return (tag==='all'||c.tag===tag)&&(!q||(c.front+' '+c.back+' '+c.tag).toLowerCase().includes(q))&&(mode==='all'||(mode==='new'&&!status[i])||(mode==='missed'&&status[i]==='missed')||(mode==='known'&&status[i]==='known'))});index=Math.max(0,current===undefined?0:filtered.indexOf(current));render()}
