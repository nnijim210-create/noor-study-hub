<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skin Anatomy Exam</title><style>body{font-family:system-ui;background:#f3f5ef;color:#20362b;margin:0}main{max-width:850px;margin:auto;padding:24px}header,.question,.result{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 2px 12px #0001}h1{margin:0;color:#315b43}.tag{color:#65806c}label{display:block;padding:11px;margin:7px 0;border:1px solid #d6ded5;border-radius:9px;cursor:pointer}label:has(input:checked){background:#e4eee5;border-color:#315b43}button{background:#315b43;color:white;border:0;padding:13px 22px;border-radius:9px;cursor:pointer;font-size:16px}.wrong{border-left:5px solid #c75b5b}.right{border-left:5px solid #438b63}.explain{margin-top:12px;font-size:14px;color:#4b6253}.hidden{display:none}#progress{position:sticky;top:0;background:#e4eee5;padding:12px;border-radius:9px;z-index:2}</style></head><body><main><header><h1>SKIN — Anatomy Exam</h1><p>40 questions · 30 MCQs + 10 True / False · Easy, Medium & Hard</p><p class="tag">Based exclusively on the uploaded “3. Skin” lecture · All 36 slides</p><p>Choose one answer per question. Submit to see your score and explanations.</p></header><div id="progress">Answered: <b id="count">0</b>/40</div><div id="quiz"></div><button id="submit" onclick="grade()">Submit Exam</button><div id="result" class="result hidden"></div></main><script>

const root=document.getElementById('quiz');data.forEach((q,i)=>{let tf=i>=30;let opts=tf?['True','False']:q[1];let html=`<section class="question" id="q${i}"><small class="tag">Question ${i+1} · ${tf?'True / False':'MCQ'} · ${i%3===0?'Hard':i%3===1?'Medium':'Easy'}</small><h3>${q[0]}</h3>`;opts.forEach((o,j)=>{html+=`<label><input type="radio" name="q${i}" value="${tf?(j===0?'T':'F'):'ABCD'[j]}" onchange="update()"> ${tf?'':('ABCD'[j]+'. ')}${o}</label>`});html+='<div class="explain hidden"></div></section>';root.insertAdjacentHTML('beforeend',html)});
